unlisted_mirrors:
  - link_to: 'sourceware'
    last_update: '-'
    name: "cygwin"
    url: '/cygwin/'

force_redirect_help_mirrors:
  - git-repo

label_map:
  unknown: text-bg-dummy
  syncing: text-bg-info
  success: text-bg-success
  fail: text-bg-warning
  failed: text-bg-warning
  paused: text-bg-warning
