name: Build Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Deploy to frontweb branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Clone the repo, trying frontweb branch first
          if git clone --branch frontweb --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} /tmp/frontweb 2>/dev/null; then
            echo "Checked out existing frontweb branch"
          else
            echo "frontweb branch does not exist, creating orphan branch"
            git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} /tmp/frontweb
            cd /tmp/frontweb
            git checkout --orphan frontweb
            git rm -rf . 2>/dev/null || true
            cd -
          fi

          # Remove existing contents (keep .git directory)
          rm -rf /tmp/frontweb/*

          # Copy built site contents
          cp -r ${{ github.workspace }}/_site/* /tmp/frontweb/

          # Commit and push
          cd /tmp/frontweb
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy frontend build from ${{ github.sha }}" || echo "No changes to commit"
          git push origin frontweb --force
